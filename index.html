<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangoo Market - Malabo</title>
    
    <!-- Configuración para convertir en App Móvil Nativa -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00A651">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2838/2838895.png">

    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body {background:#f5f5f5; padding-bottom: 20px;}
        .header {background:#00A651;color:white;padding:15px;display:flex;justify-space-between;align-items:center;position:sticky;top:0;z-index:90}
        .header h1 {font-size:22px}
        .btn-header {background:white;color:#00A651;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer}
        .cart-count {background:red;color:white;border-radius:50%;padding:2px 6px;font-size:12px;position:absolute;top:-5px;right:-5px}
        .cart-btn {position:relative}
        .container {padding:15px;max-width:600px;margin:auto}
        .product {background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1);border-left:5px solid #00A651}
        .product h3 {font-size:18px;margin-bottom:8px;color:#000}
        .precio {color:#00A651;font-size:22px;font-weight:bold;margin:8px 0}
        .vendedor {font-size:14px;color:#666;margin-bottom:8px}
        .categoria {background:#FFD700;color:#000;padding:3px 8px;border-radius:12px;font-size:12px;display:inline-block;margin-bottom:10px}
        .descripcion {font-size:14px;color:#444;margin-bottom:12px;line-height:1.4}
        .btn-add {background:#000;color:#FFD700;border:none;width:100%;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
        .modal {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100}
        .modal-content {background:white;margin:20px auto;padding:20px;border-radius:12px;max-width:500px;max-height:90vh;overflow-y:auto}
        .close {float:right;font-size:28px;cursor:pointer}
        input,textarea,select {width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
        .btn-enviar {background:#25D366;color:white;border:none;width:100%;padding:15px;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
        .btn-gps {background:#4285F4;color:white;border:none;width:100%;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;margin:8px 0}
        .separador {height:2px;background:#eee;margin:15px 0}
        .titulo-envio {color:#00A651;font-weight:bold;margin-top:15px}
        .gps-status {font-size:12px;color:#666;text-align:center;margin:5px 0}
        .aviso {background:#fff3cd;padding:10px;border-radius:8px;font-size:13px;margin:10px 0;border-left:4px solid #FFD700}
    </style>
</head>
<body>
    <div class="header">
        <h1>FANGOO</h1>
        <div>
            <button class="btn-header cart-btn" onclick="abrirCarrito()">
                🛒<span id="contador" class="cart-count">0</span>
            </button>
            <button class="btn-header" onclick="abrirEnvio()">🚚 Enviar Paquete</button>
        </div>
    </div>

    <div class="container" id="productos">
        <p style="text-align:center;padding:20px">Cargando productos...</p>
    </div>

    <!-- Modal Carrito -->
    <div id="modalCarrito" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarCarrito()">&times;</span>
            <h2>Tu Pedido</h2>
            <div id="listaCarrito"></div>
            <h3>Total: <span id="total">0</span> XAF</h3>
            <div class="aviso">⚠️ Se notificará al vendedor y al equipo Fangoo para gestionar tu entrega</div>
            <input type="text" id="clienteNombre" placeholder="Tu nombre completo">
            <input type="text" id="clienteTelefono" placeholder="Tu WhatsApp: 222xxxxxx">
            <input type="text" id="clienteDireccion" placeholder="Tu barrio en Malabo">
            <button class="btn-gps" onclick="obtenerGPSCliente()">📍 Usar mi ubicación GPS para entrega exacta</button>
            <div id="gpsCliente" class="gps-status"></div>
            <button class="btn-enviar" onclick="pedirWhatsApp()">📱 CONFIRMAR PEDIDO</button>
        </div>
    </div>

            <button class="btn-enviar" onclick="pedirWhatsApp()">📱 CONFIRMAR PEDIDO</button>
        </div>
    </div>

    <!-- Modal Envío Paquete -->
    <div id="modalEnvio" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarEnvio()">&times;</span>
            <h2>Enviar Paquete</h2>
            
            <div class="titulo-envio">TUS DATOS - REMITENTE</div>
            <input type="text" id="remNombre" placeholder="Tu nombre completo">
            <input type="text" id="remTelefono" placeholder="Tu WhatsApp: 240xxxxxx">
            <input type="text" id="remDireccion" placeholder="Tu barrio/dirección">
            <button class="btn-gps" onclick="obtenerGPS()"> Usar mi ubicación GPS actual</button>
            <div id="gpsRemitente" class="gps-status"></div>
            
            <div class="separador"></div>
            
            <div class="titulo-envio">DATOS DESTINATARIO</div>
            <input type="text" id="destNombre" placeholder="Nombre de quien recibe">
            <input type="text" id="destTelefono" placeholder="WhatsApp de quien recibe">
            <input type="text" id="destDireccion" placeholder="Barrio/dirección de entrega">
            
            <div class="separador"></div>
            
            <div class="titulo-envio">DETALLES DEL PAQUETE</div>
            <select id="tipoPaquete">
                <option value="">¿Qué envías?</option>
                <option value="Documentos">Documentos</option>
                <option value="Comida">Comida</option>
                <option value="Ropa">Ropa</option>
                <option value="Gas/Combustible">Gas/Combustible</option>
                <option value="Otro">Otro</option>
            </select>
            <textarea id="descripcionPaquete" placeholder="Describe: peso, tamaño, instrucciones..."></textarea>
            
            <button class="btn-enviar" onclick="enviarPaqueteWhatsApp()">📱 Solicitar Recogida</button>
        </div>
    </div>

<script>

const SHEETDB_URL = "https://sheetdb.io/api/v1/hyra8255u0t4k";
const WHATSAPP_FANGOO = "240555225370"; 

let productos = [];
let carrito = [];
let gpsCliente = null;
let gpsRemitente = null;

async function cargarProductos() {
    try {
        const res = await fetch(SHEETDB_URL);
        productos = await res.json();
        mostrarProductos();
    } catch(e) {
        document.getElementById('productos').innerHTML = '<p style="text-align:center;color:red;padding:20px;">Error al conectar con el servidor.</p>';
    }
}

function mostrarProductos() {
    const cont = document.getElementById('productos');
    if(!Array.isArray(productos) || productos.length === 0) {
        cont.innerHTML = '<p style="text-align:center;padding:40px">No hay productos hoy. Vuelve más tarde.</p>';
        return;
    }
    cont.innerHTML = productos.map(p => `
        <div class="product">
            <div class="categoria">${p.categoria || 'General'}</div>
            <h3>${p.nombre || p.producto}</h3>
            <div class="precio">${Number(p.precio || 0).toLocaleString()} XAF</div>
            <div class="vendedor">Vendedor: ${p.vendedor || 'Fangoo Market'}</div>
            <div class="descripcion">${p.descripcion || 'Entrega rápida en Malabo'}</div>
            <button class="btn-add" onclick='agregarCarrito(${JSON.stringify(p).replace(/'/g,"\\'")})'>+ AÑADIR AL PEDIDO</button>
        </div>
    `).join('');
}

function agregarCarrito(producto) {
    carrito.push(producto);
    document.getElementById('contador').innerText = carrito.length;
}

function abrirCarrito() {
    const lista = document.getElementById('listaCarrito');
    lista.innerHTML = carrito.length === 0 ? '<p style="padding:10px 0">Carrito vacío</p>' : carrito.map(p => `
        <div style="border-bottom:1px solid #eee;padding:10px 0">
            <strong>${p.nombre || p.producto}</strong><br>${Number(p.precio || 0).toLocaleString()} XAF - ${p.vendedor || 'Fangoo'}
        </div>
    `).join('');
    const total = carrito.reduce((sum, p) => sum + Number(p.precio || 0), 0);
    document.getElementById('total').innerText = total.toLocaleString();
    document.getElementById('modalCarrito').style.display = 'block';
}

function cerrarCarrito() { document.getElementById('modalCarrito').style.display = 'none'; }

function obtenerGPSCliente() {
    const status = document.getElementById('gpsCliente');
    status.innerText = 'Obteniendo ubicación...';
    if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            gpsCliente = `${pos.coords.latitude},${pos.coords.longitude}`;
            status.innerText = `✅ GPS capturado para entrega exacta`;
            status.style.color = 'green';
        }, () => {
            status.innerText = '❌ Permite la ubicación o escribe tu barrio';
            status.style.color = 'red';
        });
    } else {
        status.innerText = '❌ Navegador no soporta GPS';
    }
}

function obtenerGPS() {
    const status = document.getElementById('gpsRemitente');
    status.innerText = 'Obteniendo ubicación...';
    if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            gpsRemitente = `${pos.coords.latitude},${pos.coords.longitude}`;
            status.innerText = `✅ GPS capturado`;
            status.style.color = 'green';
        }, () => {
            status.innerText = '❌ Permite la ubicación para usar GPS';
            status.style.color = 'red';
        });
    } else {
        status.innerText = '❌ Navegador no soporta GPS';
    }
}

function extraerTelefono(texto) {
    if(!texto) return WHATSAPP_FANGOO;
    const match = texto.match(/(222|555)\d{6}/);
    return match ? '240' + match[0] : WHATSAPP_FANGOO;
}

function pedirWhatsApp() {
    if(carrito.length === 0) return alert('Carrito vacío');
    const nombre = document.getElementById('clienteNombre').value;
    const telefono = document.getElementById('clienteTelefono').value;
    const direccion = document.getElementById('clienteDireccion').value;
    if(!nombre ||!telefono ||!direccion) return alert('Rellena tus datos de entrega');

    const vendedores = {};
    carrito.forEach(p => {
        const tel = extraerTelefono(p.vendedor);
        if(!vendedores[tel]) vendedores[tel] = [];
        vendedores[tel].push(p);
    });

    let totalGeneral = 0;
    // MENSAJE PARA FANGOO CON TODO INCLUIDO GPS
    let mensajeFangoo = `*📋 NUEVO PEDIDO - LOGÍSTICA FANGOO*%0A%0A`;
    mensajeFangoo += `*CLIENTE*%0A👤 ${nombre}%0A📱 ${telefono}%0A📍 ${direccion}%0A`;
    if(gpsCliente) mensajeFangoo += `🗺️ *GPS ENTREGA:* https://maps.google.com/?q=${gpsCliente}%0A`;
    mensajeFangoo += `%0A*DETALLE COMPLETO DEL PEDIDO:*%0A`;

    Object.keys(vendedores).forEach(telVendedor => {
        // 1. MENSAJE AL VENDEDOR - SIN GPS
        let mensajeVendedor = `*🔔 PEDIDO NUEVO FANGOO MARKET*%0A%0A`;
        mensajeVendedor += `*CLIENTE*%0A👤 ${nombre}%0A📱 ${telefono}%0A📍 ${direccion}%0A%0A`;
        mensajeVendedor += `*PRODUCTOS PEDIDOS A TI:*%0A`;
        let totalVendedor = 0;
        vendedores[telVendedor].forEach(p => {
            mensajeVendedor += `📦 ${p.nombre} - ${Number(p.precio).toLocaleString()} XAF%0A`;
            totalVendedor += Number(p.precio);
            // Añadimos al mensaje de Fangoo
            mensajeFangoo += `📦 ${p.nombre} - ${Number(p.precio).toLocaleString()} XAF%0A Vendedor: ${p.vendedor}%0A Tel: ${telVendedor}%0A`;
        });
        totalGeneral += totalVendedor;
        mensajeVendedor += `%0A*TOTAL: ${totalVendedor.toLocaleString()} XAF*%0A%0A`;
        mensajeVendedor += `_El equipo de Fangoo llegará en 10-20 min para retirar el pedido y gestionar el pago. Confirma que tienes stock disponible._`;

        window.open(`https://wa.me/${telVendedor}?text=${mensajeVendedor}`, '_blank');
    });

    // 2. MENSAJE A FANGOO CON TODO + GPS
    setTimeout(() => {
        mensajeFangoo += `%0A*TOTAL GENERAL: ${totalGeneral.toLocaleString()} XAF*%0A%0A`;
        mensajeFangoo += `_ACCIÓN: Coordinar recogida con cada vendedor y entrega al cliente._`;
        window.open(`https://wa.me/${WHATSAPP_FANGOO}?text=${mensajeFangoo}`, '_blank');
    }, 1500);

    alert('¡Pedido enviado! Vendedores y Fangoo notificados.');
    carrito = []; gpsCliente = null;
    document.getElementById('contador').innerText = 0;
    document.getElementById('gpsCliente').innerText = '';
    cerrarCarrito();
}

function abrirEnvio() { document.getElementById('modalEnvio').style.display = 'block'; }
function cerrarEnvio() { document.getElementById('modalEnvio').style.display = 'none'; }

function enviarPaqueteWhatsApp() {
    const remNombre = document.getElementById('remNombre').value;
    const remTelefono = document.getElementById('remTelefono').value;
    const remDireccion = document.getElementById('remDireccion').value;
    const destNombre = document.getElementById('destNombre').value;
    const destTelefono = document.getElementById('destTelefono').value;
    const destDireccion = document.getElementById('destDireccion').value;
    const tipo = document.getElementById('tipoPaquete').value;
    const desc = document.getElementById('descripcionPaquete').value;

    if(!remNombre || !remTelefono || !destNombre || !destTelefono || !tipo) return alert('Rellena campos obligatorios');

    let mensaje = `*📦 SOLICITUD ENVÍO PAQUETE - FANGOO*%0A%0A`;
    mensaje += `*REMITENTE*%0A👤 ${remNombre}%0A📱 ${remTelefono}%0A📍 ${remDireccion}%0A`;
    if(gpsRemitente) mensaje += `🗺️ GPS: https://maps.google.com/?q=${gpsRemitente}%0A`;
    mensaje += `%0A*DESTINATARIO*%0A👤 ${destNombre}%0A📱 ${destTelefono}%0A📍 ${destDireccion}%0A%0A`;
    mensaje += `*PAQUETE*%0A📦 Tipo: ${tipo}%0A📝 ${desc}%0A%0A`;
    mensaje += `_El equipo de Fangoo llegará en 10-20 min para retirar el paquete._`;

    window.open(`https://wa.me/${WHATSAPP_FANGOO}?text=${mensaje}`, '_blank');
    gpsRemitente = null;
    cerrarEnvio();
}

cargarProductos();
</script>
</body>
</html>
