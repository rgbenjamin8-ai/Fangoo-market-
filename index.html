<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangoo Market - GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">

    <!-- CONFIGURACIÓN -->
    <script>
        const CONFIG = {
            SHEETDB_PRODUCTOS: 'https://sheetdb.io/api/v1/94oeji8aebkvd',
            SHEETDB_PEDIDOS: 'https://sheetdb.io/api/v1/b0sk5m9wsfjyo',
            WHATSAPP_FANGOO: '240555225370',
            CLAVE_FANGOO: 'fangoogq'
        };
    </script>

    <!-- HEADER -->
    <header class="bg-green-700 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-black">🛍️ FANGOO</h1>
            <div class="flex gap-3">
                <button onclick="abrirModal('modalVender')" class="bg-white text-green-600 px-4 py-3 rounded-lg font-black text-lg">
                    + VENDER
                </button>
                <button onclick="abrirModal('modalCarrito')" class="relative bg-yellow-400 text-black px-4 py-3 rounded-lg">
                    <i class="fa-solid fa-cart-shopping text-2xl"></i>
                    <span id="contador-carrito" class="absolute -top-2 -right-2 bg-red-600 text-white text-sm rounded-full w-6 h-6 flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="abrirModal('modalAdmin')" class="bg-black px-4 py-3 rounded-lg">
                    <i class="fa-solid fa-truck-fast text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- BANNER -->
    <div class="bg-white text-black-300 text-center py-3 font-black text-xl">
         ENTREGA Y RECOGIDA | PAGO CONTRA ENTREGA
    </div>

        <h2 class="text-4xl font-black mb-6 text-center">¿QUÉ NECESITAS HOY?</h2>
        <div id="lista-productos" class="space-y-3">
            <p class="text-2xl text-center">Cargando...</p>
        </div>
    </div>

    <!-- MODAL VENDER -->
    <div id="modalVender" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-2">
        <div class="bg-white rounded-sm w-full max-w-lg p-2 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-black">ENVIAR / VENDER </h3>
                <button onclick="cerrarModal('modalVender')"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <form id="form-vender" class="space-y-4">
                <select id="v-categoria" onchange="cambiarFormulario()" class="w-full border-2 border-black p-2 rounded-lg text-sm font-medium" required>
    <option value="">ELIGE CATEGORÍA</option>
    <option value="TARTA"> TARTA - 12-24h antes</option>
    <option value="COMIDA"> COMIDA - Menú/Congelados</option>
    <option value="PAQUETES"> ENVÍO DE PAQUETES</option>
</select>

<!-- BOTÓN SOLO ADMIN PARA GAS -->
<div class="mt-4">
    <button type="button" onclick="mostrarGasAdmin()" class="w-full bg-black text-yellow-sm py-3 rounded-lg font-black text-lg">
        <i class="fa-solid fa-lock text-yellow-sm"></i> PANEL GAS
    </button>
</div>

                <div id="form-campos" class="space-y-4">
                    <input id="v-nombre" placeholder="NOMBRE DEL PRODUCTO" class="w-full border-2 border-black p-2 rounded-lg text-sm font-bold uppercase" required>
                    <input id="v-precio" type="number" placeholder="PRECIO EN XAF" class="w-full border-2 border-black p-2 rounded-lg text-sm font-bold" required>
                    <textarea id="v-descripcion" placeholder="DESCRIPCIÓN / DETALLES" class="w-full border-2 border-black p-2 rounded-lg text-lg font-bold" rows="3" required></textarea>
                    <input id="v-whatsapp" placeholder="TU WHATSAPP 240..." class="w-full border-2 border-black p-2 rounded-lg text-sm font-bold" required>
                </div>
                </div>

                <button id="btn-publicar" class="w-full bg-green-700 text-white py-5 rounded-lg font-black text-2xl">
                    PUBLICAR AHORA
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL CARRITO CON GPS -->
    <div id="modalCarrito" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-3xl font-black">TU PEDIDO</h3>
                <button onclick="cerrarModal('modalCarrito')"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>
            <div id="items-carrito" class="space-y-4 mb-6"></div>
            <div class="border-t-4 border-black pt-4">
                <div class="flex justify-between font-black text-xl mb-6">
                    <span>TOTAL:</span>
                    <span id="total-carrito">0 XAF</span>
                </div>
                <input id="cliente-nombre" placeholder="TU NOMBRE COMPLETO" class="w-full border-2 border-black p-4 rounded-lg mb-3 text-lg font-bold uppercase" required>
                <input id="cliente-wsp" placeholder="TU WHATSAPP 240..." class="w-full border-2 border-black p-4 rounded-lg mb-3 text-lg font-bold" required>

                <!-- GPS NUEVO -->
                <div class="mb-4">
                    <button type="button" onclick="obtenerUbicacion()" id="btn-gps" class="w-full bg-blue-600 text-white py-4 rounded-lg font-black text-xl mb-2">
                        <i class="fa-solid fa-location-dot"></i> USAR MI UBICACIÓN GPS
                    </button>
                    <input id="cliente-direccion" placeholder="O ESCRIBE TU DIRECCIÓN EN MALABO" class="w-full border-2 border-black p-4 rounded-lg text-lg font-bold uppercase" required>
                    <p id="coords-info" class="text-sm font-bold text-green-700 mt-1 hidden"></p>
                </div>

                <button onclick="confirmarPedido()" class="w-full bg-black text-yellow-400 py-5 rounded-lg font-black text-2xl">
                    CONFIRMAR PEDIDO
                </button>
                <p class="text-center font-bold mt-3">FANGOO TE RASTREARÁ POR GPS</p>
            </div>
        </div>
    </div>

    <!-- MODAL ADMIN FANGOO CON MAPA -->
    <div id="modalAdmin" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-4xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-3xl font-black">PANEL FANGOO - GPS</h3>
                <button onclick="cerrarModal('modalAdmin')"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>
            <div class="mb-6">
                <input id="clave-admin" type="password" placeholder="CLAVE EQUIPO" class="border-2 border-black p-3 rounded-lg text-lg font-bold">
                <button onclick="cargarPedidos()" class="bg-green-700 text-white px-6 py-3 rounded-lg ml-2 font-black text-lg">VER PEDIDOS</button>
            </div>
            <div id="lista-pedidos" class="space-y-4"></div>
        </div>
    </div>

<script>
let productos = [];
let carrito = [];
let categoriaActual = 'TODAS';
let coordsCliente = null;

window.onload = async () => {
    await cargarProductos();
    actualizarCarrito();
};

async function cargarProductos() {
    try {
        const res = await fetch(CONFIG.SHEETDB_PRODUCTOS);
        productos = await res.json();
        renderProductos();
    } catch {
        document.getElementById('lista-productos').innerHTML = '<p class="text-xl text-center text-red-600 font-black">ERROR CARGANDO</p>';
    }
}

function filtrarCategoria(cat) {
    categoriaActual = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400'));
    event.target.classList.add('ring-4', 'ring-yellow-400');
    renderProductos();
}

function renderProductos() {
    let productosFiltrados = categoriaActual === 'TODAS'? productos : productos.filter(p => p.categoria === categoriaActual);

    const html = productosFiltrados.map(p => {
        let extraInfo = '';
        if(p.categoria === 'TARTA') extraInfo = '<p class="text-red-600 font-black text-lg">⚠️ ENCARGAR 12-24H ANTES</p>';
        if(p.categoria === 'GAS') extraInfo = '<p class="text-blue-600 font-black text-lg"> SERVICIO FANGOO</p>';

        return `
        <div class="bg-white rounded-xl shadow-lg p-6 border-4 border-black">
            <div class="flex justify-between items-start mb-2">
                <h3 class="font-black text-4xl uppercase">${p.nombre}</h3>
                <span class="bg-black text-white px-3 py-1 rounded-lg text-sm font-bold">${p.categoria}</span>
            </div>
            ${extraInfo}
            <p class="text-green-700 font-black text-5xl mb-3">${Number(p.precio).toLocaleString()} XAF</p>
            <p class="text-xl font-bold mb-4 uppercase">${p.descripcion}</p>
            <button onclick="agregarCarrito(${p.id})" class="w-full bg-black text-yellow-400 py-4 rounded-lg font-black text-2xl">
                <i class="fa-solid fa-plus"></i> AÑADIR AL PEDIDO
            </button>
        </div>
    `}).join('');
    document.getElementById('lista-productos').innerHTML = html || '<p class="text-3xl text-center font-black">NO HAY PRODUCTOS</p>';
}

function mostrarGasAdmin() {
    const clave = prompt('CLAVE ADMIN PARA PUBLICAR GAS:');
    if(clave === CONFIG.CLAVE_ADMIN) {
        const select = document.getElementById('v-categoria');
        // Añade opción GAS temporalmente
        if(!document.querySelector('#v-categoria option[value="GAS"]')) {
            select.innerHTML += '<option value="GAS" selected>GAS - ADMIN</option>';
        }
        select.value = 'GAS';
        cambiarFormulario();
        document.getElementById('v-clave').value = CONFIG.CLAVE_ADMIN;
    } else {
        alert('CLAVE INCORRECTA');
    }
}

// VENDER
document.getElementById('form-vender').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-publicar');
    btn.disabled = true;
    btn.textContent = 'PUBLICANDO...';

    const cat = document.getElementById('v-categoria').value;

    if(cat === 'GAS' && document.getElementById('v-clave').value!== CONFIG.CLAVE_ADMIN) {
        alert('SOLO EL EQUIPO FANGOO PUEDE PUBLICAR GAS');
        btn.disabled = false;
        btn.textContent = 'PUBLICAR AHORA';
        return;
    }

    try {
        let descripcionFinal = document.getElementById('v-descripcion').value;
        if(cat === 'GAS') {
            const prov = document.getElementById('v-proveedor').value;
            const cont = document.getElementById('v-contacto-prov').value;
            if(prov) descripcionFinal += ` | PROVEEDOR: ${prov}`;
            if(cont) descripcionFinal += ` | CONTACTO: ${cont}`;
        }

        await fetch(CONFIG.SHEETDB_PRODUCTOS, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                data: {
                    id: Date.now(),
                    categoria: cat,
                    nombre: document.getElementById('v-nombre').value,
                    precio: document.getElementById('v-precio').value,
                    descripcion: descripcionFinal,
                    whatsapp_vendedor: document.getElementById('v-whatsapp').value,
                    fecha: new Date().toISOString()
                }
            })
        });

        alert('¡PRODUCTO PUBLICADO!');
        cerrarModal('modalVender');
        cargarProductos();
        e.target.reset();
        document.getElementById('campo-clave-gas').classList.add('hidden');
    } catch(err) {
        alert('ERROR: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'PUBLICAR AHORA';
    }
});

// CARRITO
function agregarCarrito(id) {
    const prod = productos.find(p => p.id == id);
    const existe = carrito.find(i => i.id == id);
    if(existe) existe.cantidad++;
    else carrito.push({...prod, cantidad: 1});
    actualizarCarrito();
}

function actualizarCarrito() {
    document.getElementById('contador-carrito').textContent = carrito.reduce((a,i) => a + i.cantidad, 0);
    const total = carrito.reduce((a,i) => a + i.precio * i.cantidad, 0);
    document.getElementById('total-carrito').textContent = total.toLocaleString() + ' XAF';

    document.getElementById('items-carrito').innerHTML = carrito.map(i => `
        <div class="flex justify-between items-center border-b-4 border-black pb-3">
            <div>
                <p class="font-black text-2xl uppercase">${i.nombre}</p>
                <p class="text-lg font-bold">${i.categoria}</p>
                <p class="text-xl font-bold">${i.cantidad} x ${Number(i.precio).toLocaleString()} XAF</p>
            </div>
            <button onclick="eliminarCarrito(${i.id})" class="text-red-600 text-3xl"><i class="fa-solid fa-trash"></i></button>
        </div>
    `).join('') || '<p class="text-2xl font-black text-center">CARRITO VACÍO</p>';
}

function eliminarCarrito(id) {
    carrito = carrito.filter(i => i.id!= id);
    actualizarCarrito();
}

// GPS - OBTENER UBICACIÓN
function obtenerUbicacion() {
    const btn = document.getElementById('btn-gps');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> LOCALIZANDO...';

    if (!navigator.geolocation) {
        alert('TU NAVEGADOR NO SOPORTA GPS');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-location-dot"></i> USAR MI UBICACIÓN GPS';
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            coordsCliente = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
            };
            document.getElementById('cliente-direccion').value = `GPS: ${coordsCliente.lat.toFixed(6)}, ${coordsCliente.lng.toFixed(6)}`;
            document.getElementById('coords-info').textContent = `✅ UBICACIÓN CAPTURADA: ${coordsCliente.lat.toFixed(4)}, ${coordsCliente.lng.toFixed(4)}`;
            document.getElementById('coords-info').classList.remove('hidden');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> UBICACIÓN GUARDADA';
            btn.classList.remove('bg-blue-600');
            btn.classList.add('bg-green-600');
        },
        (err) => {
            alert('ERROR GPS: ' + err.message + '\nEscribe tu dirección manual');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-location-dot"></i> USAR MI UBICACIÓN GPS';
        }
    );
}

// PEDIDO CON GPS
async function confirmarPedido() {
    if(carrito.length === 0) return alert('CARRITO VACÍO');

    const nombre = document.getElementById('cliente-nombre').value;
    const wsp = document.getElementById('cliente-wsp').value;
    const direccion = document.getElementById('cliente-direccion').value;
    if(!nombre ||!wsp ||!direccion) return alert('COMPLETA TODOS LOS DATOS');

    const total = carrito.reduce((a,i) => a + i.precio * i.cantidad, 0);
    const id_pedido = 'FG' + Date.now();

    let alertaTarta = carrito.some(i => i.categoria === 'TARTA')? '\n⚠️ CONTIENE TARTA - CONFIRMAR 12-24H ANTES' : '';
    let linkMapa = coordsCliente? `\n📍 MAPA: https://www.google.com/maps?q=${coordsCliente.lat},${coordsCliente.lng}` : '';

    try {
        await fetch(CONFIG.SHEETDB_PEDIDOS, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                data: {
                    id_pedido: id_pedido,
                    cliente_nombre: nombre,
                    cliente_wsp: wsp,
                    cliente_direccion: direccion,
                    lat: coordsCliente? coordsCliente.lat : '',
                    lng: coordsCliente? coordsCliente.lng : '',
                    productos: JSON.stringify(carrito),
                    total: total,
                    estado: 'PENDIENTE',
                    fecha: new Date().toISOString()
                }
            })
        });

        const mensaje = `🚨 PEDIDO ${id_pedido}${alertaTarta}${linkMapa}\n\nCLIENTE: ${nombre}\nWSP: ${wsp}\nDIRECCIÓN: ${direccion}\n\nPRODUCTOS:\n${carrito.map(i => `- ${i.cantidad}x [${i.categoria}] ${i.nombre}`).join('\n')}\n\nTOTAL: ${total.toLocaleString()} XAF\n\nRECOGER Y ENTREGAR. PAGO CONTRA ENTREGA.`;
        window.open(`https://wa.me/${CONFIG.WHATSAPP_FANGOO}?text=${encodeURIComponent(mensaje)}`, '_blank');

        alert(`¡PEDIDO ${id_pedido} CONFIRMADO!`);
        carrito = [];
        coordsCliente = null;
        document.getElementById('coords-info').classList.add('hidden');
        document.getElementById('btn-gps').innerHTML = '<i class="fa-solid fa-location-dot"></i> USAR MI UBICACIÓN GPS';
        document.getElementById('btn-gps').classList.remove('bg-green-600');
        document.getElementById('btn-gps').classList.add('bg-blue-600');
        actualizarCarrito();
        cerrarModal('modalCarrito');

    } catch(err) {
        alert('ERROR: ' + err.message);
    }
}

// PANEL FANGOO CON GPS
async function cargarPedidos() {
    if(document.getElementById('clave-admin').value !== CONFIG.CLAVE_ADMIN) return alert('CLAVE INCORRECTA');

    try {
        const res = await fetch(CONFIG.SHEETDB_PEDIDOS);
        const pedidos = await res.json();

        document.getElementById('lista-pedidos').innerHTML = pedidos.reverse().map(p => {
            let btnMapa = '';
            if(p.lat && p.lng) {
                btnMapa = `<a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" class="bg-blue-600 text-white px-6 py-3 rounded-lg text-xl font-black">
                    <i class="fa-solid fa-map-location-dot"></i> VER EN MAPA
                </a>`;
            }

            return `
            <div class="border-4 border-black rounded-xl p-6 ${p.estado === 'ENTREGADO'? 'bg-green-100' : 'bg-yellow-100'}">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <p class="font-black text-3xl">${p.id_pedido} - ${p.estado}</p>
                        <p class="text-xl font-bold mt-2"><i class="fa-solid fa-user"></i> ${p.cliente_nombre} | <i class="fa-solid fa-phone"></i> ${p.cliente_wsp}</p>
                        <p class="text-xl font-bold"><i class="fa-solid fa-location-dot"></i> ${p.cliente_direccion}</p>
                        ${p.lat? `<p class="text-sm font-bold text-blue-600">GPS: ${p.lat}, ${p.lng}</p>` : ''}
                    </div>
                    <p class="font-black text-4xl">${Number(p.total).toLocaleString()} XAF</p>
                </div>
                <p class="text-xl font-bold mb-4 uppercase">PRODUCTOS: ${JSON.parse(p.productos).map(i => `${i.cantidad}x [${i.categoria}] ${i.nombre}`).join(', ')}</p>
                <div class="flex gap-3 flex-wrap">
                    ${btnMapa}
                    <a href="https://wa.me/${p.cliente_wsp}" target="_blank" class="bg-green-600 text-white px-6 py-3 rounded-lg text-xl font-black">
                        <i class="fa-brands fa-whatsapp"></i> CLIENTE
                    </a>
                    ${p.estado !== 'ENTREGADO'? `<button onclick="marcarEntregado('${p.id_pedido}')" class="bg-black text-yellow-400 px-6 py-3 rounded-lg text-xl font-black">ENTREGADO</button>` : ''}
                </div>
            </div>
        `}).join('') || '<p class="text-3xl font-black text-center">NO HAY PEDIDOS</p>';
    } catch {
        alert('ERROR CARGANDO PEDIDOS');
    }
}

async function marcarEntregado(id) {
    await fetch(`${CONFIG.SHEETDB_PEDIDOS}/id_pedido/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({data: {estado: 'ENTREGADO'}})
    });
    cargarPedidos();
}

// UTILS
function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }
</script>

</body>
</html>
